<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clinic — Unimed Sorocaba</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --unimed-green:#00A859;
  --unimed-green-dark:#009650;
  --unimed-green-darker:#00813F;
  --unimed-lime:#A3C940;
  --ink:#444;
  --ink-soft:#6f7782;
  --line:#e8eaed;
  --bg:#f5f6f8;
  --purple:#6f5bd6;
  --yellow:#f0b429;
  --red:#e05252;
  --sidebar-w:218px;
  --panel-w:330px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'Roboto',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;overflow:hidden}

/* ===== TOPBAR ===== */
.topbar{height:64px;background:var(--unimed-green);display:flex;align-items:center;gap:18px;padding:0 18px;color:#fff;position:relative;z-index:30}
.brand{display:flex;flex-direction:column;line-height:1}
.brand .name{font-size:30px;font-weight:300;letter-spacing:.5px}
.brand .ver{font-size:10px;opacity:.85;margin-top:2px}
.unimed-badge{border:2px solid #fff;border-radius:4px;padding:4px 14px;background:rgba(255,255,255,.06);display:flex;flex-direction:column;align-items:center;line-height:1.1}
.unimed-badge .u{font-weight:700;font-size:15px;font-style:italic;letter-spacing:.3px}
.unimed-badge .s{font-size:9px;opacity:.9}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.top-ic{position:relative;width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;transition:background .15s;font-size:19px;border:0;background:transparent}
.top-ic:hover{background:rgba(255,255,255,.15)}
.top-ic .cnt{font-size:13px;font-weight:500;margin-left:4px}
.avatar-top{width:38px;height:38px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--unimed-green);font-size:20px;cursor:pointer}

/* ===== LAYOUT ===== */
.app{display:flex;height:calc(100vh - 64px)}

/* ===== SIDEBAR ===== */
.sidebar{width:var(--sidebar-w);background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:10px 0;overflow-y:auto;flex-shrink:0}
.nav-item-c{display:flex;align-items:center;gap:12px;padding:11px 18px;color:var(--unimed-green-dark);cursor:pointer;font-weight:400;font-size:14.5px;border-left:4px solid transparent;transition:background .12s;user-select:none}
.nav-item-c i{font-size:18px;width:20px;text-align:center}
.nav-item-c:hover{background:#f2faf6}
.nav-item-c.active{background:#e2f4ea;border-left-color:var(--unimed-green);font-weight:500}
.nav-item-c .chev{margin-left:auto;font-size:12px;opacity:.7}

/* ===== MIDDLE PANEL ===== */
.panel{width:var(--panel-w);background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 6px}
.cal-head .title{font-size:15px;color:var(--ink);font-weight:400}
.cal-nav{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:#fff;color:#999;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cal-nav:hover{background:#f4f4f4}
table.cal{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
table.cal th{color:var(--unimed-green);font-weight:500;text-align:center;padding:6px 0;font-size:12.5px;background:#f0f7f3}
table.cal td{text-align:center;padding:0;height:32px}
.day{width:30px;height:30px;line-height:30px;border-radius:50%;display:inline-block;cursor:pointer;color:#555;position:relative}
.day:hover{background:#e9f6ef}
.day.out{color:#b9c2cc}
.day.sel{background:var(--unimed-green);color:#fff;font-weight:500}
.day .dot{position:absolute;top:1px;left:50%;transform:translateX(-50%);width:14px;height:3px;border-radius:2px}
.dot.r{background:#e74c3c}.dot.y{background:var(--yellow)}

.agendas-bar{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;border-top:1px solid var(--line);margin-top:8px}
.agendas-bar .t{font-size:15px;color:var(--ink)}
.agendas-bar .hoje{margin-left:auto;color:var(--ink-soft);font-size:13px;cursor:pointer}
.agendas-bar i{color:#8a939e;font-size:16px;cursor:pointer}
.agendas-bar i:hover{color:var(--unimed-green)}
.agenda-list{overflow-y:auto;flex:1;padding:4px 10px 14px}
.agenda-card{display:flex;align-items:center;gap:10px;padding:12px 10px;border-radius:8px;cursor:pointer;border-left:4px solid transparent;transition:background .12s}
.agenda-card:hover{background:#f5f8f6}
.agenda-card.sel{background:#eef3fb;border-left-color:#2f6fd0}
.agenda-av{width:44px;height:44px;border-radius:50%;background:#eef1f4;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:17px;color:#7d8794;font-weight:500;flex-shrink:0}
.agenda-av.med{color:var(--unimed-green);background:#fff;border:2px solid var(--unimed-green)}
.agenda-info{flex:1;min-width:0}
.agenda-info .n{font-size:14px;color:#3c4450;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agenda-info .e{font-size:12.5px;color:var(--unimed-green)}
.agenda-card .chk{font-size:20px;color:#c6ccd4;flex-shrink:0}
.agenda-card.sel .chk{color:var(--unimed-lime)}
.agenda-card .arrow{color:#aab2bc;font-size:12px}

/* ===== MAIN ===== */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.main-head{display:flex;align-items:flex-start;gap:14px;padding:18px 24px 10px}
.collapse-btn{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:8px;color:#98a1ab;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-top:3px}
.main-title h1{font-size:21px;font-weight:400;color:#4a4f57;letter-spacing:.3px;margin:0;display:flex;align-items:center;gap:10px}
.main-title h1 i{color:#9aa3ad;font-size:17px;cursor:pointer}
.main-sub{color:#828a94;font-size:14px;margin-top:3px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.main-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.act-ic{width:42px;height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#8a939e;display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;transition:all .12s}
.act-ic:hover{color:var(--unimed-green);border-color:var(--unimed-green)}
.btn-marcar{background:#8db82e;border:0;color:#fff;font-weight:600;font-size:13px;letter-spacing:.4px;padding:10px 20px;border-radius:6px;transition:background .15s}
.btn-marcar:hover{background:#7da526;color:#fff}

.sched-wrap{flex:1;overflow:hidden;padding:6px 24px 20px}
.sched-card{background:#fff;border:1px solid var(--line);border-radius:10px;height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.doc-head{display:flex;align-items:center;gap:14px;padding:16px 18px 12px;border-left:5px solid var(--unimed-green)}
.doc-av{width:52px;height:52px;border-radius:50%;border:2px solid var(--unimed-green);display:flex;align-items:center;justify-content:center;color:var(--unimed-green);font-size:22px;background:#fff;flex-shrink:0}
.doc-meta .n{font-size:15px;color:#3c4450}
.doc-meta .e{font-size:13px;color:#828a94}
.occ{flex:1;display:flex;align-items:center;gap:10px;padding:0 6px 0 14px}
.occ .bar{flex:1;height:7px;border-radius:4px;background:#e7eaee;overflow:hidden}
.occ .fill{height:100%;background:var(--unimed-green);border-radius:4px;width:88%;transition:width .6s ease}
.occ .pct{font-size:12px;color:#7d8794}

.slots{flex:1;overflow-y:auto;border-top:1px solid var(--line)}
.slot{display:grid;grid-template-columns:64px 70px 1.5fr 1fr 1fr 40px;align-items:center;padding:13px 14px;border-bottom:1px solid #f0f2f4;cursor:pointer;transition:background .1s}
.slot:hover{background:#fafcfb}
.slot-ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px}
.ic-purple{background:var(--purple)}
.ic-yellow{background:var(--yellow)}
.ic-green{background:var(--unimed-green)}
.ic-red{background:var(--red)}
.ic-blue{background:#3d8bd9}
.slot .hr{font-size:14px;color:#5a626c}
.slot .pac{font-size:13.5px;font-weight:700;color:#3c4450;display:flex;align-items:center;gap:8px;letter-spacing:.2px}
.slot .pac i{color:#6f7782;font-weight:400;font-size:14px}
.slot .tipo,.slot .conv{font-size:13px;color:#828a94}
.slot .free{color:var(--unimed-green);font-size:13.5px}
.slot .kebab{color:#9aa3ad;font-size:17px;text-align:center}
.slot .kebab:hover{color:var(--unimed-green)}

/* placeholder views */
.placeholder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#9aa3ad;gap:12px}
.placeholder i{font-size:52px;color:#cfd6db}
.placeholder .t{font-size:17px;color:#7d8794}

/* ===================== JORNADA ASSISTENCIAL ===================== */
.j-tabs{display:flex;gap:6px;padding:0 24px;border-bottom:1px solid var(--line);background:transparent}
.j-tab{padding:11px 18px;font-size:14px;color:#7d8794;cursor:pointer;border-bottom:3px solid transparent;display:flex;align-items:center;gap:8px;user-select:none}
.j-tab i{font-size:15px}
.j-tab:hover{color:var(--unimed-green)}
.j-tab.active{color:var(--unimed-green);border-bottom-color:var(--unimed-green);font-weight:500}
.j-tab .pill{background:#e2f4ea;color:var(--unimed-green-darker);border-radius:10px;font-size:11.5px;padding:1px 8px;font-weight:500}

.j-body{flex:1;overflow-y:auto;padding:18px 24px 24px}
.j-section-title{display:flex;align-items:center;gap:10px;font-size:15px;color:#4a4f57;margin:4px 0 12px;font-weight:500}
.j-section-title i{color:var(--unimed-green);font-size:17px}
.j-section-title .hint{font-weight:400;font-size:12.5px;color:#9aa3ad;margin-left:4px}

.guia-card{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04);overflow:hidden;border-left:5px solid transparent}
.guia-card.st-autorizada{border-left-color:var(--unimed-green)}
.guia-card.st-analise{border-left-color:var(--yellow)}
.guia-card.st-negada{border-left-color:var(--red)}
.guia-card.st-agendada{border-left-color:var(--purple)}
.guia-row{display:grid;grid-template-columns:54px 1.5fr 2fr 110px 130px 150px;gap:8px;align-items:center;padding:14px 16px;cursor:pointer}
.guia-row:hover{background:#fafcfb}
.guia-row .num{font-size:13px;color:#5a626c}
.guia-row .num small{display:block;color:#9aa3ad;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.guia-row .pac{font-weight:700;font-size:13.5px;color:#3c4450;letter-spacing:.2px}
.guia-row .pac small{display:block;font-weight:400;color:#828a94;font-size:12.5px;margin-top:2px}
.badge-st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;border-radius:14px;padding:4px 12px}
.badge-st.autorizada{background:#e2f4ea;color:var(--unimed-green-darker)}
.badge-st.analise{background:#fdf3dc;color:#a87a10}
.badge-st.negada{background:#fdeaea;color:#b54040}
.badge-st.agendada{background:#ece9fb;color:#5443b8}
.guia-actions{display:flex;justify-content:flex-end;align-items:center;gap:10px}
.btn-agendar{background:var(--unimed-green);border:0;color:#fff;font-weight:600;font-size:12.5px;letter-spacing:.3px;padding:8px 18px;border-radius:6px}
.btn-agendar:hover{background:var(--unimed-green-darker);color:#fff}
.guia-exp{color:#9aa3ad;font-size:14px;transition:transform .2s}
.guia-card.open .guia-exp{transform:rotate(180deg)}
.guia-detail{display:none;border-top:1px dashed var(--line);background:#fbfcfc;padding:14px 18px}
.guia-card.open .guia-detail{display:block}
.gd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 20px}
.gd-item .l{font-size:11px;color:#9aa3ad;text-transform:uppercase;letter-spacing:.5px}
.gd-item .v{font-size:13.5px;color:#4a4f57;margin-top:2px}
.gd-item .v.green{color:var(--unimed-green-darker);font-weight:500}

/* ===== Minhas Cirurgias ===== */
.cir-layout{display:grid;grid-template-columns:400px 1fr;gap:18px;height:100%}
.cir-cal-card,.cir-list-card{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.04);display:flex;flex-direction:column;overflow:hidden}
.cir-cal-card{padding:14px}
table.bigcal{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13.5px}
table.bigcal th{color:var(--unimed-green);font-weight:500;text-align:center;padding:8px 0;background:#f0f7f3;font-size:12.5px}
table.bigcal td{text-align:center;height:48px;border:1px solid #f0f2f4;vertical-align:middle;cursor:pointer;position:relative}
table.bigcal td:hover{background:#f2faf6}
table.bigcal td.out{color:#c2cad2;cursor:default;background:#fbfcfc}
table.bigcal td.selc{background:var(--unimed-green);color:#fff;font-weight:500}
table.bigcal td .cdot{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);display:flex;gap:3px}
table.bigcal td .cdot span{width:6px;height:6px;border-radius:50%;background:var(--unimed-green)}
table.bigcal td.selc .cdot span{background:#fff}
.cir-legend{display:flex;gap:16px;padding:12px 4px 2px;font-size:12px;color:#828a94;align-items:center}
.cir-legend span{display:flex;align-items:center;gap:6px}
.cir-legend .lg{width:9px;height:9px;border-radius:50%;background:var(--unimed-green)}

.cir-list-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.cir-list-head .d{font-size:15px;color:#4a4f57;font-weight:500}
.cir-list-head .c{margin-left:auto;font-size:12.5px;color:#828a94}
.cir-list-body{flex:1;overflow-y:auto;padding:10px 14px}
.cir-item{border:1px solid var(--line);border-left:5px solid var(--unimed-green);border-radius:10px;margin-bottom:12px;overflow:hidden}
.cir-item .top{display:flex;align-items:center;gap:14px;padding:13px 14px;cursor:pointer}
.cir-item .top:hover{background:#fafcfb}
.cir-item .hr{font-size:16px;color:var(--unimed-green-darker);font-weight:500;min-width:54px}
.cir-item .info{flex:1;min-width:0}
.cir-item .info .p{font-weight:700;font-size:13.5px;color:#3c4450}
.cir-item .info .pr{font-size:12.5px;color:#828a94;margin-top:2px}
.cir-chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;border-radius:14px;padding:4px 11px;background:#f0f4f2;color:#5a626c}
.chip i{font-size:12px;color:var(--unimed-green)}
.cir-detail{display:none;border-top:1px dashed var(--line);background:#fbfcfc;padding:13px 16px}
.cir-item.open .cir-detail{display:block}
.mat-title{font-size:11.5px;color:#9aa3ad;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.mat-title i{color:var(--unimed-green)}
.mat-list{display:flex;flex-direction:column;gap:6px}
.mat-list .m{display:flex;align-items:center;gap:9px;font-size:13px;color:#4a4f57}
.mat-list .m i{color:var(--unimed-lime);font-size:14px}
.empty-day{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#9aa3ad;padding:50px 20px;text-align:center}
.empty-day i{font-size:42px;color:#d4dade}

/* status url bar */
.urlbar{position:fixed;bottom:0;left:0;background:#f1f3f4;border:1px solid var(--line);border-bottom:0;border-left:0;padding:4px 12px;font-size:12px;color:#5f6368;border-top-right-radius:6px;z-index:50}

/* modal padrão */
.modal-header-unimed{background:var(--unimed-green);color:#fff;border-top-left-radius:12px;border-top-right-radius:12px}
.form-label-c{font-size:12.5px;color:#6f7782;margin-bottom:4px}
.resumo-guia{background:#f0f7f3;border:1px solid #d8ecdf;border-radius:8px;padding:12px 14px;margin-bottom:14px}
.resumo-guia .p{font-weight:700;font-size:13.5px;color:#3c4450}
.resumo-guia .pr{font-size:12.5px;color:#5a626c;margin-top:2px}
.resumo-guia .g{font-size:12px;color:var(--unimed-green-darker);margin-top:4px}

::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#cdd3d9;border-radius:6px}
::-webkit-scrollbar-track{background:#f1f3f4}
</style>
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
  <div class="brand">
    <span class="name">clinic</span>
    <span class="ver">26.5.262</span>
  </div>
  <div class="unimed-badge">
    <span class="u">Unimed <i class="bi bi-flower1" style="font-size:10px"></i></span>
    <span class="s">Sorocaba</span>
  </div>
  <div class="top-actions">
    <button class="top-ic" title="Listas"><i class="bi bi-list-task"></i></button>
    <button class="top-ic" title="Teleconsultas"><i class="bi bi-camera-video"></i><span class="cnt">0</span></button>
    <button class="top-ic" title="Espera"><i class="bi bi-clock"></i><span class="cnt">1</span></button>
    <button class="top-ic" title="Mensagens"><i class="bi bi-chat-left-text"></i></button>
    <div class="avatar-top"><i class="bi bi-person-fill"></i></div>
  </div>
</header>

<div class="app">

  <!-- SIDEBAR -->
  <nav class="sidebar" id="sidebar">
    <div class="nav-item-c active" data-view="agendas"><i class="bi bi-calendar3"></i> Agendas</div>
    <div class="nav-item-c" data-view="atendimento"><i class="bi bi-clipboard2-pulse"></i> Atendimento</div>
    <div class="nav-item-c" data-view="dashboards"><i class="bi bi-grid-1x2"></i> Dashboards <i class="bi bi-chevron-down chev"></i></div>
    <div class="nav-item-c" data-view="personal"><i class="bi bi-person"></i> Personal</div>
    <div class="nav-item-c" data-view="pacientes"><i class="bi bi-people"></i> Pacientes</div>
    <div class="nav-item-c" data-view="faturamento"><i class="bi bi-receipt"></i> Faturamento <i class="bi bi-chevron-down chev"></i></div>
    <div class="nav-item-c" data-view="financeiro"><i class="bi bi-currency-dollar"></i> Financeiro <i class="bi bi-chevron-down chev"></i></div>
    <div class="nav-item-c" data-view="relatorios"><i class="bi bi-file-earmark-text"></i> Relatórios</div>
    <div class="nav-item-c" data-view="cadastros"><i class="bi bi-person-badge"></i> Cadastros <i class="bi bi-chevron-down chev"></i></div>
    <div class="nav-item-c" data-view="configuracoes"><i class="bi bi-gear"></i> Configurações <i class="bi bi-chevron-down chev"></i></div>
    <div class="nav-item-c" data-view="jornada"><i class="bi bi-heart-pulse"></i> Jornada Assistencial</div>
  </nav>

  <!-- MIDDLE PANEL (calendário + agendas) -->
  <aside class="panel" id="panelAgendas">
    <div class="cal-head">
      <button class="cal-nav" onclick="moveMonth(-1)"><i class="bi bi-chevron-left"></i></button>
      <span class="title" id="calTitle">Junho 2026</span>
      <button class="cal-nav" onclick="moveMonth(1)"><i class="bi bi-chevron-right"></i></button>
    </div>
    <table class="cal">
      <thead><tr><th>D</th><th>S</th><th>T</th><th>Q</th><th>Q</th><th>S</th><th>S</th></tr></thead>
      <tbody id="calBody"></tbody>
    </table>

    <div class="agendas-bar">
      <span class="t">Agendas</span>
      <span class="hoje" onclick="goToday()">Hoje</span>
      <i class="bi bi-eye"></i>
      <i class="bi bi-search"></i>
      <i class="bi bi-plus-lg"></i>
    </div>
    <div class="agenda-list" id="agendaList"></div>
  </aside>

  <!-- MAIN -->
  <main class="main" id="mainArea"></main>
</div>

<div class="urlbar" id="urlbar">https://clinic.globalhealth.mv/clinic/#/schedule</div>

<!-- MODAL MARCAR CONSULTA -->
<div class="modal fade" id="modalMarcar" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius:12px;border:0">

function renderCal(){
  document.getElementById('calTitle').textContent = meses[cal.m]+' '+cal.y;
  const first = new Date(cal.y, cal.m, 1).getDay();
  const dim = new Date(cal.y, cal.m+1, 0).getDate();
  const dimPrev = new Date(cal.y, cal.m, 0).getDate();
  let html='', d=1, next=1;
  for(let w=0; w<6; w++){
    html+='<tr>';
    for(let wd=0; wd<7; wd++){
      const idx = w*7+wd;
      if(idx<first){
        html+=`<td><span class="day out">${dimPrev-first+wd+1}</span></td>`;
      } else if(d<=dim){
        const sel = d===cal.sel ? 'sel':'';
        const dot = (d>=8 && d<=10 && cal.m===5) ? `<span class="dot ${d===10?'y':'r'}"></span>` : '';
        html+=`<td><span class="day ${sel}" onclick="selDay(${d})">${dot}${d}</span></td>`;
        d++;
      } else {
        html+=`<td><span class="day out">${next++}</span></td>`;
      }
    }
    html+='</tr>';
    if(d>dim && next>7) break;
  }
  document.getElementById('calBody').innerHTML = html;
}
function moveMonth(dir){
  cal.m+=dir;
  if(cal.m<0){cal.m=11;cal.y--}
  if(cal.m>11){cal.m=0;cal.y++}

}
function selDay(d){
  cal.sel=d;
  const dt = new Date(cal.y, cal.m, d);
  const el = document.getElementById('dayTitle');
  if(el) el.innerHTML = `${dias[dt.getDay()]}, ${d} DE ${meses[cal.m].toUpperCase()} DE ${cal.y} <i class="bi bi-calendar4-week"></i>`;
  renderCal();
}

      <i class="bi bi-check-circle-fill" style="color:var(--unimed-lime)"></i>
      <span class="flex-grow-1">${m}</span>
      <i class="bi bi-x-lg" style="color:#b9c2cc;cursor:pointer;font-size:12px" onclick="agMats.splice(${i},1);renderAgMats()"></i>
    </div>`).join('') || '<div style="font-size:12.5px;color:#9aa3ad;padding:4px">Nenhum material adicionado</div>';
}
function addMaterial(){
  const inp = document.getElementById('agMatNovo');
  if(inp.value.trim()){agMats.push(inp.value.trim());inp.value='';renderAgMats();}
}
function confirmarAgendamento(){
  const g = guiaSelecionada;
  const data = document.getElementById('agData').value;
  const c = {
    h: document.getElementById('agHora').value,
    pac: g.pac,
    proc: g.proc.split('— ')[1] || g.proc,
    sala: document.getElementById('agSala').value,
    hosp: document.getElementById('agHosp').value,
    anest: document.getElementById('agAnest').value,
    mats: [...agMats]
  };
  if(!cirurgias[data]) cirurgias[data]=[];
  cirurgias[data].push(c);
  cirurgias[data].sort((a,b)=>a.h.localeCompare(b.h));
  g.status='agendada';
  bootstrap.Modal.getInstance(document.getElementById('modalAgendar')).hide();
  cirCal.sel = data;
  const [y,m] = data.split('-').map(Number);
  cirCal.y=y; cirCal.m=m-1;
  setJTab('cirurgias');
}

/* ===== Minhas Cirurgias ===== */
function renderCirurgias(){
  document.getElementById('jBody').innerHTML = `
    <div class="cir-layout">
      <div class="cir-cal-card">
        <div class="cal-head" style="padding:2px 2px 10px">
          <button class="cal-nav" onclick="moveCirMonth(-1)"><i class="bi bi-chevron-left"></i></button>
          <span class="title" id="cirCalTitle"></span>
          <button class="cal-nav" onclick="moveCirMonth(1)"><i class="bi bi-chevron-right"></i></button>
        </div>
        <table class="bigcal">
          <thead><tr><th>D</th><th>S</th><th>T</th><th>Q</th><th>Q</th><th>S</th><th>S</th></tr></thead>
          <tbody id="cirCalBody"></tbody>
        </table>
        <div class="cir-legend"><span><span class="lg"></span> Dia com cirurgia agendada</span></div>
      </div>
      <div class="cir-list-card">
        <div class="cir-list-head">
          <i class="bi bi-calendar-heart" style="color:var(--unimed-green);font-size:17px"></i>
          <span class="d" id="cirDiaTitle"></span>
          <span class="c" id="cirDiaCount"></span>
        </div>
        <div class="cir-list-body" id="cirLista"></div>
      </div>
    </div>`;
  renderCirCal();
  renderCirDia();
}
function renderCirCal(){
  document.getElementById('cirCalTitle').textContent = meses[cirCal.m]+' '+cirCal.y;
  const first = new Date(cirCal.y, cirCal.m, 1).getDay();
  const dim = new Date(cirCal.y, cirCal.m+1, 0).getDate();
  let html='', d=1;
  for(let w=0; w<6 && d<=dim; w++){
    html+='<tr>';
    for(let wd=0; wd<7; wd++){
      const idx=w*7+wd;
      if(idx<first || d>dim){ html+='<td class="out"></td>'; }
      else{
        const key = `${cirCal.y}-${String(cirCal.m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const tem = cirurgias[key] && cirurgias[key].length;
        const sel = key===cirCal.sel ? 'selc':'';
        html+=`<td class="${sel}" onclick="selCirDia('${key}')">${d}${tem?`<span class="cdot">${'<span></span>'.repeat(Math.min(cirurgias[key].length,3))}</span>`:''}</td>`;
        d++;
      }
    }
    html+='</tr>';
  }
  document.getElementById('cirCalBody').innerHTML = html;
}
function moveCirMonth(dir){
  cirCal.m+=dir;
  if(cirCal.m<0){cirCal.m=11;cirCal.y--}
  if(cirCal.m>11){cirCal.m=0;cirCal.y++}
  renderCirCal();
}
function selCirDia(key){
  cirCal.sel = key;
  renderCirCal();
  renderCirDia();
}
function renderCirDia(){
  const [y,m,d] = cirCal.sel.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  document.getElementById('cirDiaTitle').textContent = `${dias[dt.getDay()]}, ${d} de ${meses[m-1]} de ${y}`;
  const lista = cirurgias[cirCal.sel] || [];
  document.getElementById('cirDiaCount').textContent = lista.length ? `${lista.length} cirurgia(s)` : '';
  document.getElementById('cirLista').innerHTML = lista.length ? lista.map((c,i)=>`
    <div class="cir-item" id="ci-${i}">
      <div class="top" onclick="document.getElementById('ci-${i}').classList.toggle('open')">
        <div class="hr">${c.h}</div>
        <div class="info">
          <div class="p">${c.pac}</div>
          <div class="pr">${c.proc}</div>
        </div>
        <div class="cir-chips">
          <span class="chip"><i class="bi bi-door-open"></i>${c.sala}</span>
          <span class="chip"><i class="bi bi-hospital"></i>${c.hosp.replace('Hospital ','')}</span>
          <span class="chip"><i class="bi bi-droplet"></i>${c.anest}</span>
        </div>
        <i class="bi bi-chevron-down guia-exp" style="margin-left:6px"></i>
      </div>
      <div class="cir-detail">
        <div class="mat-title"><i class="bi bi-box-seam"></i> Sala &amp; Materiais</div>
        <div class="mat-list">
          <div class="m"><i class="bi bi-door-open-fill" style="color:var(--unimed-green)"></i><strong style="font-weight:500">${c.sala}</strong> — ${c.hosp}</div>
          ${c.mats.map(mm=>`<div class="m"><i class="bi bi-check-circle-fill"></i>${mm}</div>`).join('')}
        </div>
      </div>
    </div>`).join('') :
    `<div class="empty-day"><i class="bi bi-calendar-x"></i><div>Nenhuma cirurgia agendada para este dia</div>
     <div style="font-size:12.5px">Selecione um dia com marcador verde no calendário</div></div>`;
}

/* ================= NAVEGAÇÃO SIDEBAR ================= */
const placeholders = {
  atendimento:{ic:'bi-clipboard2-pulse',t:'Atendimento'},
  dashboards:{ic:'bi-grid-1x2',t:'Dashboards'},
  personal:{ic:'bi-person',t:'Personal'},
  pacientes:{ic:'bi-people',t:'Pacientes'},
  faturamento:{ic:'bi-receipt',t:'Faturamento'},
  financeiro:{ic:'bi-currency-dollar',t:'Financeiro'},
  relatorios:{ic:'bi-file-earmark-text',t:'Relatórios'},
  cadastros:{ic:'bi-person-badge',t:'Cadastros'},
  configuracoes:{ic:'bi-gear',t:'Configurações'}
};

document.querySelectorAll('.nav-item-c').forEach(item=>{
  item.addEventListener('click',()=>{
    document.querySelectorAll('.nav-item-c').forEach(n=>n.classList.remove('active'));
    item.classList.add('active');
    const v = item.dataset.view;
    const panel = document.getElementById('panelAgendas');
    const main = document.getElementById('mainArea');
    const url = document.getElementById('urlbar');
    if(v==='agendas'){
      panel.style.display='flex';
      main.innerHTML = viewAgendas;
      renderSlots();
      url.textContent='https://clinic.globalhealth.mv/clinic/#/schedule';
    } else if(v==='jornada'){
      panel.style.display='none';
      main.innerHTML = viewJornada;
      renderGuias();
      url.textContent='https://clinic.globalhealth.mv/clinic/#/care-journey';
    } else {
      panel.style.display='none';
      const p = placeholders[v];
      main.innerHTML = `<div class="placeholder">
        <i class="bi ${p.ic}"></i>
        <div class="t">${p.t}</div>
        <div style="font-size:13px">Módulo em construção — protótipo navegável</div>
      </div>`;
      url.textContent='https://clinic.globalhealth.mv/clinic/#/'+v;
    }
  });
});

/* ================= INIT ================= */
document.getElementById('mainArea').innerHTML = viewAgendas;
renderCal();
renderAgendas();
renderSlots();
</script>
</body>
</html>
