<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Centro de Comando Assistencial — Unimed Sorocaba</title>
  <link rel="icon" href="assets/logo.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.datatables.net/2.0.8/css/dataTables.dataTables.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div id="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <img src="assets/logo.svg" alt="Unimed" />
        <div>
          <strong>Super Dash</strong>
          <small>Centro de Comando Assistencial</small>
        </div>
      </div>
      <nav id="nav" class="nav-menu"></nav>
      <div class="sidebar-footer">
        <span class="status-dot"></span>
        <div>
          <strong>Modo executivo</strong>
          <small>SPA estática · sem backend</small>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <div class="eyebrow">Unimed Sorocaba · Gestão Populacional</div>
          <h1 id="page-title">Centro de Comando</h1>
        </div>
        <div class="top-actions">
          <button class="btn btn-ghost" id="btnCsv"><i data-lucide="file-down"></i> CSV</button>
          <button class="btn btn-ghost" id="btnExcel"><i data-lucide="sheet"></i> Excel</button>
          <button class="btn btn-ghost" id="btnPdf"><i data-lucide="file-text"></i> PDF</button>
          <button class="btn btn-primary" id="btnPrint"><i data-lucide="printer"></i> Imprimir</button>
        </div>
      </header>

      <section id="content" class="content"></section>
    </main>
  </div>

  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="detail-drawer" id="detailDrawer" aria-hidden="true">
    <button class="drawer-close" id="drawerClose"><i data-lucide="x"></i></button>
    <div id="drawerContent"></div>
  </aside>

  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/2.0.8/js/dataTables.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="assets/data.js"></script>
  <script src="app.js"></script>
</body>
</html>
